# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#

---
include:
  - board: xiao_ble
    shield: pereda_left_central
    artifact-name: left-central

  - board: xiao_ble
    shield: pereda_left
    artifact-name: left-peripheral

  - board: xiao_ble
    shield: pereda_right
    artifact-name: right-peripheral

  - board: nrf52840dongle_nrf52840
    shield: pereda_dongle
    artifact-name: central-dongle


#settings_reset
  - board: xiao_ble
    shield: settings_reset
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y

  - board: nrf52840dongle_nrf52840
    shield: settings_reset
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y -DCONFIG_FLASH=y -DCONFIG_FLASH_MAP=y -DCONFIG_FLASH_PAGE_LAYOUT=y -DCONFIG_NRFX_NVMC=y -DCONFIG_NVS=y -DCONFIG_SETTINGS=y -DCONFIG_SETTINGS_NVS=y -DCONFIG_REBOOT=y

